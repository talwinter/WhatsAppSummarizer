plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// ---- Release signing inputs, resolved before the android block needs them ----
// Put these in local.properties (already gitignored), or export them as environment
// variables in CI:
//   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def secret = { String name ->
    localProperties.getProperty(name) ?: System.getenv(name)
}

def releaseStorePassword = secret('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = secret('RELEASE_KEY_ALIAS')
def releaseKeyPassword = secret('RELEASE_KEY_PASSWORD')
def releaseKeystoreFile = rootProject.file('keystore.jks')

def canSignRelease = releaseStorePassword != null && releaseKeyAlias != null &&
        releaseKeyPassword != null && releaseKeystoreFile.exists()

if (!canSignRelease) {
    logger.lifecycle('Release signing not configured - release builds will be unsigned. ' +
            'See the comment above the signingConfigs block in app/build.gradle.')
}

android {
    namespace 'com.example.whatsapp_summarizer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.whatsapp_summarizer"
        minSdk 26
        targetSdk 34
        versionCode 28
        versionName "4.0"
    }

    // Release signing credentials are read from local.properties (gitignored) or the
    // environment - never written in this file, which is committed to a public repo.
    // Release signing is skipped entirely when they are absent, so cloning the repo
    // and building a debug APK works with no setup.
    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig canSignRelease ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
